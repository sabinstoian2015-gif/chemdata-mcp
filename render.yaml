services:
  - type: web
    name: chemdata-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MCP_PATH
        sync: false        # you will be asked for this; use /mcp-<long random string>
      - key: MAX_RESULT_CHARS
        value: "12000"
